name: HACS custom repository validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate custom repository (default-listing brands deferred to M4)
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
          comment: false
