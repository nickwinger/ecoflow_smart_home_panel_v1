name: HACS custom repository validation

# Run only when explicitly started from GitHub Actions.
# No automatic push/PR notifications or repeated failure emails.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate custom repository (listing metadata deferred to M4)
        uses: hacs/action@main
        with:
          category: integration
          # Custom installation does not need default-listing metadata. Keep
          # technical checks active without repeated topics-only failure mail.
          ignore: brands topics
          comment: false
