name: HACS custom repository validation

# Run only when explicitly started from GitHub Actions.
# No automatic push/PR notifications or repeated failure emails.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate custom repository including local brand assets
        uses: hacs/action@main
        with:
          category: integration
          # Topics are optional default-catalog metadata. Local brand assets
          # are checked; all installation-related validations remain active.
          ignore: topics
          comment: false
