name: Offline validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Validate disposable Docker Compose layout
        run: |
          docker compose -f .devcontainer/ha.compose.yml config -q
          bash -n scripts/dev-ha.sh
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: python scripts/sync_catalog.py --check
      - run: python -m compileall -q custom_components
      - name: Offline HA and Recorder tests (network blocked)
        run: pytest -q --timeout=30 --cov=custom_components.ecoflow_smart_home_panel_v1 --cov-report=term-missing
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
