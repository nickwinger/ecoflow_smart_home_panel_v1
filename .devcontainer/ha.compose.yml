# Shared disposable stack for WSL CLI and VS Code Dev Containers.
# VS Code attaches to 'workspace'; Home Assistant runs as a sibling service.
# NEVER mount production Home Assistant files or Docker's privileged socket here.
name: ecoflow-shp-v1-live-test

services:
  seed:
    image: busybox:1.36
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /config/configuration.yaml ]; then
          cp /seed/configuration.yaml /config/configuration.yaml
        fi
    volumes:
      - ha_config:/config
      - ./ha-configuration.yaml:/seed/configuration.yaml:ro
    networks: [dev_cloud]
    restart: "no"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.3
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      TZ: Europe/Vienna
    ports:
      - "127.0.0.1:8124:8123"
    volumes:
      - ha_config:/config
      - ../custom_components:/config/custom_components:ro
    networks: [dev_cloud]
    restart: "no"
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

  # One-shot DEV account bootstrap; no passwords or tokens are exported.
  bootstrap:
    image: python:3.12-slim-bookworm
    command: ["python", "/bootstrap/dev_ha_bootstrap.py", "--compose-service"]
    depends_on:
      homeassistant:
        condition: service_started
    volumes:
      - ../scripts/dev_ha_bootstrap.py:/bootstrap/dev_ha_bootstrap.py:ro
    networks: [dev_cloud]
    restart: "no"
    security_opt:
      - no-new-privileges:true

  # Development container has neither a production HA mount nor docker.sock.
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: ["sleep", "infinity"]
    init: true
    working_dir: /workspaces/ecoflow_smart_home_panel_v1
    depends_on:
      homeassistant:
        condition: service_started
    volumes:
      - ../:/workspaces/ecoflow_smart_home_panel_v1:cached
    networks: [dev_cloud]
    security_opt:
      - no-new-privileges:true

networks:
  dev_cloud:
    driver: bridge

volumes:
  ha_config:
